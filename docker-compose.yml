services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    command: ["postgres", "-c", "max_connections=200", "-c", "synchronous_commit=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # minio/minio was removed from Docker Hub; this is the same MinIO release (2024-09-22).
    image: bitnamilegacy/minio:2024.9.22
    environment:
      MINIO_ROOT_USER: nascon
      MINIO_ROOT_PASSWORD: nascon-secret
      MINIO_DEFAULT_BUCKETS: receipts

  api:
    build: ./backend
    volumes:
      - recordings:/recordings:ro
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      PORT: "8080"
      # API worker processes (backend/src/server.js). 1 = single process; N > 1 = cluster with Redis fan-out.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DATABASE_URL: postgres://nascon:nascon@postgres:5432/nascon
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-nascon-dev-jwt-secret-change-me}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: nascon
      MINIO_SECRET_KEY: nascon-secret
      MINIO_BUCKET: receipts
      MEDIAMTX_API: http://mediamtx:9997
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mediamtx:
        condition: service_started
    networks:
      default:
        # Selenium Grid nodes reach the guest web player at http://backend:8080 (spec 6.2.1).
        aliases:
          - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: postgres://nascon:nascon@postgres:5432/nascon
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Media server (spec 6.1): RTMP ingest 1935, HLS 8888, WebRTC WHIP/WHEP 8889 (+ ICE on 8189/udp).
  # The image is scratch-based (no shell or curl), so it has no healthcheck.
  mediamtx:
    # -ffmpeg variant: includes a shell, wget and ffmpeg for the auth/VOD hooks and the co-stream compositor.
    image: bluenviron/mediamtx:1.9.1-ffmpeg
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    volumes:
      - ./backend/media/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # Selenium Grid 4 hub + 3 browser nodes (spec 6.2.1). shm 1gb and no VNC keep the
  # browsers from OOM-crashing on 8 GB machines.
  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:4444/status | grep -Eq '\"ready\": *true'"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  node-chrome-1:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &selenium-node-env
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_START_VNC: "false"
    healthcheck: &selenium-node-health
      test: ["CMD-SHELL", "curl -sSf http://localhost:5555/status | grep -Eq '\"availability\": *\"UP\"'"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  node-chrome-2:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *selenium-node-env
    healthcheck: *selenium-node-health
    restart: unless-stopped

  node-firefox:
    image: selenium/node-firefox:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *selenium-node-env
    healthcheck: *selenium-node-health
    restart: unless-stopped

volumes:
  recordings:

networks:
  default:
